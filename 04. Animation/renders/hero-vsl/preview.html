<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero-VSL preview</title>
<style>
  body { margin: 0; background: #013bff; font-family: system-ui, sans-serif; color: #fff; }
  .hero { padding: 64px 24px 80px; text-align: center; }
  .hero h1 { font-size: clamp(34px, 5vw, 64px); line-height: 1.05; letter-spacing: -0.04em; font-weight: 500; margin: 0 auto 40px; max-width: 900px; }
  .hero p { color: #b6c7ff; font-size: clamp(18px, 2vw, 26px); margin: 40px auto 0; max-width: 760px; }
</style>
</head>
<body>
<section class="hero">
  <h1>Preview: de hero-video in een blauwe hero</h1>
<!--
  BetaalBuddy · hero-video
  Plak dit hele blok in de HTML-tab van een Oxygen "Code Block", op de plek van
  de drie zwevende kaartjes onder de kop.
  · speelt automatisch, zonder geluid, in een lus;
  · desktop krijgt de 16:9-versie, mobiel (onder 768 px) de 4:5-versie;
  · pauzeert als de video uit beeld is;
  · bij "verminderde beweging" geen autoplay: dan staat het slotbeeld stil;
  · de hele video linkt naar de startpagina (haal de <a> weg als je dat niet wilt).
-->
<a class="bb-vsl" href="/start-met-betaalbuddy/" aria-label="Start met BetaalBuddy">
  <video
    class="bb-vsl__video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    data-desktop="web/betaalbuddy-hero-desktop.mp4"
    data-mobile="web/betaalbuddy-hero-mobile.mp4"
    aria-label="Zo werkt BetaalBuddy: stuur je rekening door, Buddy seint je op tijd en jij betaalt op tijd. Werkt met elk mailprogramma, we bewaren je mail niet en er is geen AI die je mail leest."
  ></video>
</a>

<style>
  .bb-vsl {
    display: block;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    border-radius: 28px;
    overflow: hidden;
    background: #fafbff;
    box-shadow: 0 30px 80px rgba(0, 20, 120, 0.35);
  }
  .bb-vsl__video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  @media (max-width: 767px) {
    .bb-vsl {
      aspect-ratio: 4 / 5;
      max-width: 520px;
      border-radius: 22px;
    }
  }
</style>

<script>
  (function () {
    var video = document.querySelector(".bb-vsl__video");
    if (!video) return;
    var mobile = window.matchMedia("(max-width: 767px)").matches;
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // iOS only autoplays when muted is also set as a property.
    video.muted = true;
    video.defaultMuted = true;

    if (reduced) {
      // No autoplay; show the end frame (promise + button) as a still.
      video.autoplay = false;
      video.removeAttribute("autoplay");
      video.addEventListener("loadedmetadata", function () { video.currentTime = 9.3; }, { once: true });
    }

    video.src = mobile ? video.dataset.mobile : video.dataset.desktop;
    if (reduced) return;

    var play = function () {
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    };
    play();

    // Pause while scrolled out of view, resume when it comes back.
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(
        function (entries) {
          if (entries[0].isIntersecting) play();
          else video.pause();
        },
        { threshold: 0.25 }
      ).observe(video);
    }
  })();
</script>

  <p>Lokale testpagina met de bestanden uit web/. Smaller dan 768 px toont de 4:5-versie; herlaad na het verkleinen.</p>
</section>
</body>
</html>
